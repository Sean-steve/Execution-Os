name: Execution OS CI

concurrency:
  group: execution-os-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'reconcile/**'
      - 'hos/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: HOS Integration Certification
        run: bun run test:hos:cert
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
