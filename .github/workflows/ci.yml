name: Execution OS CI

on:
  push:
    branches:
      - main
      - 'reconcile/**'
      - 'hos/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
